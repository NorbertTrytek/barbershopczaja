<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Czaja Barbershop — Wystaw opinię</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

html{height:100%}

body{
  font-family:'Barlow',sans-serif;
  background:#f7f6f4;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  /* safe areas for notch phones */
  padding: max(40px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(40px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}

.page{
  width:100%;
  max-width:460px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
}

/* ornament */
.orn{display:flex;align-items:center;gap:10px;margin-bottom:clamp(24px,5vw,36px);opacity:0;animation:up .5s ease forwards}
.orn-line{width:36px;height:1px;background:#ccc}
.orn-dot{width:6px;height:6px;border-radius:50%;background:#d42b2b}

/* logo */
.logo{
  width:clamp(140px,45vw,300px);
  height:auto;
  margin-bottom:clamp(20px,5vw,28px);
  opacity:0;animation:up .5s .07s ease forwards;
}

/* tricolor rule */
.rule{display:flex;width:48px;height:3px;border-radius:2px;overflow:hidden;margin-bottom:clamp(20px,5vw,28px);opacity:0;animation:up .5s .12s ease forwards}
.rule span{flex:1}
.rule span:nth-child(1){background:#d42b2b}
.rule span:nth-child(2){background:#e0e0e0}
.rule span:nth-child(3){background:#1a3fa4}

/* stars */
.stars{font-size:clamp(18px,5vw,22px);letter-spacing:4px;color:#f5a623;margin-bottom:clamp(16px,4vw,24px);opacity:0;animation:up .5s .16s ease forwards}

/* heading */
h1{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:900;
  font-size:clamp(38px,11vw,56px);
  letter-spacing:-.01em;
  text-transform:uppercase;
  line-height:.95;
  margin-bottom:clamp(10px,3vw,14px);
  opacity:0;animation:up .5s .2s ease forwards;
}
h1 em{color:#d42b2b;font-style:normal}

.sub{
  font-size:clamp(13px,3.5vw,15px);
  font-weight:300;
  color:#888;
  line-height:1.65;
  margin-bottom:clamp(32px,8vw,44px);
  opacity:0;animation:up .5s .24s ease forwards;
}

/* buttons */
.btns{width:100%;display:flex;flex-direction:column;gap:12px;margin-bottom:clamp(32px,8vw,44px);opacity:0;animation:up .5s .3s ease forwards}

.btn{
  display:flex;
  align-items:center;
  width:100%;
  padding:0 clamp(16px,4vw,22px);
  height:clamp(64px,18vw,74px);
  border-radius:8px;
  text-decoration:none;
  color:#fff;
  border:none;
  cursor:pointer;
  position:relative;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  transition:transform .15s,box-shadow .15s;
}
/* touch feedback */
@media(hover:hover){
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.15)}
}
.btn:active{transform:scale(.98)}

.btn-g{background:#fff;color:#222;box-shadow:0 0 0 1.5px #e0e0e0}
.btn-fb{background:#1877f2}

.btn-ico{width:clamp(20px,5vw,24px);height:clamp(20px,5vw,24px);flex-shrink:0}

.btn-txt{display:flex;flex-direction:column;align-items:flex-start;margin-left:clamp(12px,3vw,16px);flex:1;min-width:0}
.btn-main{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:700;
  font-size:clamp(14px,4vw,17px);
  letter-spacing:.06em;
  text-transform:uppercase;
  line-height:1;
  margin-bottom:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:100%;
}
.btn-hint{font-size:clamp(10px,2.5vw,12px);font-weight:400;opacity:.55;letter-spacing:.02em}

.btn-arr{font-size:18px;opacity:.35;margin-left:auto;padding-left:8px;flex-shrink:0;transition:transform .15s,opacity .15s}
@media(hover:hover){.btn:hover .btn-arr{transform:translateX(4px);opacity:.65}}

/* separator */
.sep{display:flex;align-items:center;gap:12px;color:#bbb;font-size:11px;letter-spacing:.2em;text-transform:uppercase}
.sep::before,.sep::after{content:'';flex:1;height:1px;background:#e0e0e0}

/* footer */
.foot{display:flex;flex-direction:column;gap:10px;opacity:0;animation:up .5s .4s ease forwards;padding-top:clamp(20px,5vw,28px);border-top:1px solid #e8e8e8;width:100%}
.f-row{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(12px,3vw,13px);color:#999;text-decoration:none;transition:color .15s;-webkit-tap-highlight-color:transparent}
.f-row:active{color:#333}
@media(hover:hover){.f-row:hover{color:#333}}
.f-row svg{width:14px;height:14px;flex-shrink:0}

/* bottom tag */
.tag{margin-top:clamp(24px,6vw,36px);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#ccc;font-weight:300;opacity:0;animation:up .5s .46s ease forwards}

@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<main class="page">

  <div class="orn"><div class="orn-line"></div><div class="orn-dot"></div><div class="orn-line"></div></div>

  <img class="logo" src="image/logo.svg" alt="Czaja Barbershop"/>

  <div class="rule"><span></span><span></span><span></span></div>

  <div class="stars">★★★★★</div>

  <h1>Zostaw<br><em>opinię</em></h1>
  <p class="sub">Spodobała Ci się wizyta?<br>Twoja opinia to dla nas ogromne wsparcie!</p>

  <div class="btns">

    <a class="btn btn-g"

      <svg class="btn-ico" viewBox="0 0 24 24">

        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      <div class="btn-txt">
        <span class="btn-main">Oceń nas w Google</span>
        <span class="btn-hint">Napisz recenzję w Google Maps</span>
      </div>
      <span class="btn-arr">→</span>
    </a>

    <div class="sep">lub</div>

    <a class="btn btn-fb"
       href="https://www.facebook.com/p/Czaja-Barbershop-100042368572342/reviews"
       target="_blank" rel="noopener">
      <svg class="btn-ico" viewBox="0 0 24 24" fill="white">
        <path d="M24 12.073C24 5.073 18.627 0 12 0S0 5.405 0 12.073C0 18.1 4.388 23.094 10.125 24v-8.437H7.078v-3.49h3.047V9.41c0-3.025 1.791-4.697 4.533-4.697 1.312 0 2.686.236 2.686.236v2.97h-1.513c-1.491 0-1.956.931-1.956 1.886v2.267h3.328l-.532 3.49h-2.796V24C19.612 23.094 24 18.1 24 12.073z"/>
      </svg>
      <div class="btn-txt">
        <span class="btn-main">Oceń nas na Facebooku</span>
        <span class="btn-hint">Podziel się doświadczeniem</span>
      </div>
      <span class="btn-arr">→</span>
    </a>

  </div>

  <div class="foot">
    <a class="f-row" href="tel:+48517454054">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 6.75c0 8.284 6.716 15 15 15h2.25a2.25 2.25 0 002.25-2.25v-1.372c0-.516-.351-.966-.852-1.091l-4.423-1.106c-.44-.11-.902.055-1.173.417l-.97 1.293c-.282.376-.769.542-1.21.38a12.035 12.035 0 01-7.143-7.143c-.162-.441.004-.928.38-1.21l1.293-.97c.363-.271.527-.734.417-1.173L6.963 3.102a1.125 1.125 0 00-1.091-.852H4.5A2.25 2.25 0 002.25 4.5v2.25z"/></svg>
      517 454 054
    </a>
    <span class="f-row">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
      al. Piłsudskiego 22, Legnica
    </span>
  </div>

  <p class="tag">Czaja Barbershop · Legnica</p>

</main>
</body>
</html>
